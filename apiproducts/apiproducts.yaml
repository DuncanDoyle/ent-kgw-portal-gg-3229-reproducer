# ApiProducts, one per case. The controller writes a stitched ApiDoc named case-<x>-v1.
---
apiVersion: portal.solo.io/v1alpha1
kind: ApiProduct
metadata:
  name: case-a
  namespace: portal-repro
spec:
  id: case-a
  displayName: "Case A"
  versions:
    - name: v1
      targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: case-a}]
