# Portal store. emptyDir on purpose — see install/install-portal-postgres.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-postgres
  namespace: kgateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-postgres
  template:
    metadata:
      labels:
        app: portal-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: portal-postgres-credentials
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: "0.2"
            limits:
              memory: 512Mi
              cpu: "1"
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portal-postgres
  namespace: kgateway-system
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: portal-postgres
