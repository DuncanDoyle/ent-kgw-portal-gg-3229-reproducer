# ApiDocs. Cases A-E each get the same four-operation spec, served by that case's Service.
# number-v2 has its own one-operation spec, used only by case E's shadow rule.
---
apiVersion: portal.solo.io/v1alpha1
kind: ApiDoc
metadata:
  name: case-a-doc
  namespace: portal-repro
spec:
  servedBy: {group: "", kind: Service, name: case-a, namespace: portal-repro, port: 8080}
  source:
    manual:
      content: |
        openapi: 3.0.0
        info: {title: Org Service (case a), version: "1.0"}
        paths:
          /person:    {get: {operationId: getPerson,    summary: from case-a, responses: {"200": {description: OK}}}}
          /address:   {get: {operationId: getAddress,   summary: from case-a, responses: {"200": {description: OK}}}}
          /number:    {get: {operationId: getNumber,    summary: from case-a, responses: {"200": {description: OK}}}}
          /lineitems: {get: {operationId: getLineitems, summary: from case-a, responses: {"200": {description: OK}}}}
